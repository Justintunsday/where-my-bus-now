name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      preview_only:
        description: 'Build a test IPA first (compile only; skip simulator validation)'
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview IPA (compile only)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_only }}
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version
      - name: Archive and package test IPA
        run: bash scripts/build_unsigned_ipa.sh
      - uses: actions/upload-artifact@v5
        with:
          name: HKBusETA-unsigned-ipa
          path: ${{ runner.temp }}/HKBusETA-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  compatibility:
    name: iOS 17 compatibility (Xcode 16.4)
    if: ${{ !inputs.preview_only }}
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Show compatibility SDK
        run: xcodebuild -version
      - name: Install iOS 17.5 runtime when absent
        timeout-minutes: 10
        run: |
          if ! xcrun simctl list runtimes available | grep -q 'iOS 17'; then
            xcodebuild -downloadPlatform iOS -buildVersion 17.5
          fi
      - name: Build, launch and test on iOS 17
        run: bash scripts/validate_ios17.sh
      - name: Upload iOS 17 evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: iOS-17-compatibility
          path: |
            ${{ runner.temp }}/ios17-screenshots
            ${{ runner.temp }}/iOS17Tests.xcresult
          if-no-files-found: warn

  build:
    name: Build iOS app
    if: ${{ !inputs.preview_only }}
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Live Activity contract and resource tests
        run: |
          python3 scripts/check_transit_resources.py
          xcrun swiftc -parse-as-library -O -D BUS_CONTRACT_TESTS \
            Shared/BusActivityAttributes.swift Shared/BusActivityPreviewData.swift \
            scripts/activity_contract_self_test.swift -o "$RUNNER_TEMP/activity_contract_test"
          "$RUNNER_TEMP/activity_contract_test"
          xcrun swiftc -parse-as-library -O -D BUS_CONTRACT_TESTS \
            Shared/BusActivityAttributes.swift Shared/BusActivityPreviewData.swift \
            HKBusETA/Services/BusActivityPushRegistration.swift scripts/activity_push_self_test.swift \
            -o "$RUNNER_TEMP/activity_push_test"
          "$RUNNER_TEMP/activity_push_test"

      - name: Offline mainland provider self-test
        run: |
          xcrun swiftc -parse-as-library -O \
            HKBusETA/Utilities/ChineseConverter.swift \
            HKBusETA/Utilities/Localization.swift \
            HKBusETA/Models/EtaDB.swift \
            HKBusETA/Models/Eta.swift \
            HKBusETA/Models/TransitOperator.swift \
            HKBusETA/Services/MainlandTransitProvider.swift \
            HKBusETA/Services/AMapClient.swift \
            HKBusETA/Services/CheLaileAPIClient.swift \
            HKBusETA/Services/AMapTransitProvider.swift \
            scripts/mainland_self_test.swift \
            -o "$RUNNER_TEMP/mainland_self_test"
          "$RUNNER_TEMP/mainland_self_test"

      - name: Offline hosted CheLaile API self-test
        run: |
          xcrun swiftc -parse-as-library -O \
            HKBusETA/Utilities/ChineseConverter.swift \
            HKBusETA/Utilities/Localization.swift \
            HKBusETA/Models/EtaDB.swift \
            HKBusETA/Models/Eta.swift \
            HKBusETA/Models/TransitOperator.swift \
            HKBusETA/Services/TransitProvider.swift \
            HKBusETA/Services/MainlandTransitProvider.swift \
            HKBusETA/Services/MainlandRouteAdapter.swift \
            HKBusETA/Services/AMapClient.swift \
            HKBusETA/Services/AMapTransitProvider.swift \
            HKBusETA/Services/CheLaileAPIClient.swift \
            HKBusETA/Services/CheLaileAPIProvider.swift \
            scripts/chelaile_api_self_test.swift \
            -o "$RUNNER_TEMP/chelaile_api_self_test"
          "$RUNNER_TEMP/chelaile_api_self_test"

      - name: Offline stop navigation self-test
        run: |
          xcrun swiftc -parse-as-library -O \
            HKBusETA/Utilities/ChineseConverter.swift \
            HKBusETA/Utilities/Localization.swift \
            HKBusETA/Models/EtaDB.swift \
            HKBusETA/Services/StopNavigationURLBuilder.swift \
            scripts/stop_navigation_self_test.swift \
            -o "$RUNNER_TEMP/stop_navigation_self_test"
          "$RUNNER_TEMP/stop_navigation_self_test"

      - name: Bookmark region isolation self-test
        run: |
          xcrun swiftc -parse-as-library -O \
            HKBusETA/Utilities/ChineseConverter.swift \
            HKBusETA/Utilities/Localization.swift \
            HKBusETA/Models/EtaDB.swift \
            HKBusETA/Services/BookmarkStore.swift \
            scripts/bookmark_region_self_test.swift \
            -o "$RUNNER_TEMP/bookmark_region_self_test"
          "$RUNNER_TEMP/bookmark_region_self_test"

      - name: Hosted CheLaile API reachability (allowed to fail)
        continue-on-error: true
        run: |
          curl -fsS --max-time 20 "https://ts-api.tundrey.com/v1/health"
          curl -fsS --max-time 20 "https://chelaile-api-server.vercel.app/v1/health"

      - name: Build for iOS Simulator
        run: |
          xcodebuild() {
            command xcodebuild \
              -project HKBusETA.xcodeproj \
              -scheme HKBusETA \
              -configuration Debug \
              -derivedDataPath "$RUNNER_TEMP/BusDerived" \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -resultBundlePath "$RUNNER_TEMP/HKBusETA.xcresult" \
              CODE_SIGNING_ALLOWED=NO \
              "$@"
          }
          for attempt in 1 2 3; do
            echo "Simulator build attempt $attempt"
            rm -rf "$RUNNER_TEMP/HKBusETA.xcresult"
            if xcodebuild build; then
              exit 0
            fi
            echo "Attempt $attempt failed (possible Xcode build-system crash), retrying..."
            sleep 10
          done
          echo "=== DiagnosticReports ==="
          ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null || true
          for f in ~/Library/Logs/DiagnosticReports/*.ips; do
            echo "--- $f"
            python3 scripts/parse_ips.py "$f" || true
          done
          echo "=== xcresult console ==="
          xcrun xcresulttool get log --path "$RUNNER_TEMP/HKBusETA.xcresult" --type console 2>&1 | tail -300 || true
          exit 1

      - name: Archive for iOS device (unsigned)
        run: |
          for attempt in 1 2 3; do
            echo "Archive attempt $attempt"
            if xcodebuild \
              -project HKBusETA.xcodeproj \
              -scheme HKBusETA \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/HKBusETA.xcarchive" \
              CODE_SIGNING_ALLOWED=NO \
              archive; then
              exit 0
            fi
            echo "Attempt $attempt failed (possible Xcode build-system crash), retrying..."
            rm -rf "$RUNNER_TEMP/HKBusETA.xcarchive"
            sleep 10
          done
          exit 1

      - name: Package unsigned IPA
        run: |
          test -d "$RUNNER_TEMP/HKBusETA.xcarchive/Products/Applications/HKBusETA.app/PlugIns/BusArrivalWidget.appex"
          /usr/libexec/PlistBuddy -c 'Print NSSupportsLiveActivities' "$RUNNER_TEMP/HKBusETA.xcarchive/Products/Applications/HKBusETA.app/Info.plist" | grep true
          cd "$RUNNER_TEMP"
          rm -rf Payload HKBusETA-unsigned.ipa
          mkdir -p Payload
          cp -R HKBusETA.xcarchive/Products/Applications/HKBusETA.app Payload/
          zip -qry HKBusETA-unsigned.ipa Payload
          ls -lh HKBusETA-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v5
        with:
          name: HKBusETA-unsigned-ipa
          path: ${{ runner.temp }}/HKBusETA-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Native navigation UI tests
        run: |
          bash scripts/prepare_simulator.sh phone
          device=$(cat "$RUNNER_TEMP/bus-simulator-id")
          xcodebuild test -project HKBusETA.xcodeproj -scheme HKBusETA \
            -configuration Debug -destination "platform=iOS Simulator,id=$device" \
            -derivedDataPath "$RUNNER_TEMP/BusDerived" \
            -resultBundlePath "$RUNNER_TEMP/TransitUITests.xcresult" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Native-transit-ui-tests
          path: ${{ runner.temp }}/TransitUITests.xcresult
          if-no-files-found: warn


  screenshots:
    name: UI evidence (${{ matrix.device }})
    if: ${{ !inputs.preview_only }}
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device: [phone, ipad]
    steps:
      - uses: actions/checkout@v5
      - name: Build preview host and embedded widget
        run: |
          xcodebuild build -project HKBusETA.xcodeproj -scheme HKBusETA -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/BusDerived" -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
      - name: Capture UI layouts
        timeout-minutes: 22
        run: bash scripts/capture_simulator_screenshots.sh "${{ matrix.device }}"
      - name: Capture original interface for comparison
        if: matrix.device == 'phone'
        run: bash scripts/capture_baseline_screenshot.sh
      - name: Upload screenshots and runtime inventory
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Native-transit-screenshots-${{ matrix.device }}
          path: ${{ runner.temp }}/bus-screenshots
          if-no-files-found: warn
