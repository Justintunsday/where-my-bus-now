name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS app
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Offline mainland provider self-test
        run: |
          xcrun swiftc -parse-as-library -O \
            HKBusETA/Utilities/ChineseConverter.swift \
            HKBusETA/Utilities/Localization.swift \
            HKBusETA/Models/EtaDB.swift \
            HKBusETA/Models/Eta.swift \
            HKBusETA/Models/TransitOperator.swift \
            HKBusETA/Services/MainlandTransitProvider.swift \
            HKBusETA/Services/AMapClient.swift \
            HKBusETA/Services/CheLaileAPIClient.swift \
            HKBusETA/Services/AMapTransitProvider.swift \
            scripts/mainland_self_test.swift \
            -o "$RUNNER_TEMP/mainland_self_test"
          "$RUNNER_TEMP/mainland_self_test"

      - name: Offline hosted CheLaile API self-test
        run: |
          xcrun swiftc -parse-as-library -O \
            HKBusETA/Utilities/ChineseConverter.swift \
            HKBusETA/Utilities/Localization.swift \
            HKBusETA/Models/EtaDB.swift \
            HKBusETA/Models/Eta.swift \
            HKBusETA/Models/TransitOperator.swift \
            HKBusETA/Services/TransitProvider.swift \
            HKBusETA/Services/MainlandTransitProvider.swift \
            HKBusETA/Services/MainlandRouteAdapter.swift \
            HKBusETA/Services/AMapClient.swift \
            HKBusETA/Services/AMapTransitProvider.swift \
            HKBusETA/Services/CheLaileAPIClient.swift \
            HKBusETA/Services/CheLaileAPIProvider.swift \
            scripts/chelaile_api_self_test.swift \
            -o "$RUNNER_TEMP/chelaile_api_self_test"
          "$RUNNER_TEMP/chelaile_api_self_test"

      - name: Offline stop navigation self-test
        run: |
          xcrun swiftc -parse-as-library -O \
            HKBusETA/Utilities/ChineseConverter.swift \
            HKBusETA/Utilities/Localization.swift \
            HKBusETA/Models/EtaDB.swift \
            HKBusETA/Services/StopNavigationURLBuilder.swift \
            scripts/stop_navigation_self_test.swift \
            -o "$RUNNER_TEMP/stop_navigation_self_test"
          "$RUNNER_TEMP/stop_navigation_self_test"

      - name: Bookmark region isolation self-test
        run: |
          xcrun swiftc -parse-as-library -O \
            HKBusETA/Utilities/ChineseConverter.swift \
            HKBusETA/Utilities/Localization.swift \
            HKBusETA/Models/EtaDB.swift \
            HKBusETA/Services/BookmarkStore.swift \
            scripts/bookmark_region_self_test.swift \
            -o "$RUNNER_TEMP/bookmark_region_self_test"
          "$RUNNER_TEMP/bookmark_region_self_test"

      - name: Hosted CheLaile API reachability (allowed to fail)
        continue-on-error: true
        run: |
          curl -fsS --max-time 20 "https://ts-api.tundrey.com/v1/health"
          curl -fsS --max-time 20 "https://chelaile-api-server.vercel.app/v1/health"

      - name: Build for iOS Simulator
        run: |
          xcodebuild() {
            command xcodebuild \
              -project HKBusETA.xcodeproj \
              -scheme HKBusETA \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -resultBundlePath "$RUNNER_TEMP/HKBusETA.xcresult" \
              CODE_SIGNING_ALLOWED=NO \
              "$@"
          }
          for attempt in 1 2 3; do
            echo "Simulator build attempt $attempt"
            rm -rf "$RUNNER_TEMP/HKBusETA.xcresult"
            if xcodebuild build; then
              exit 0
            fi
            echo "Attempt $attempt failed (possible Xcode build-system crash), retrying..."
            sleep 10
          done
          echo "=== DiagnosticReports ==="
          ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null || true
          for f in ~/Library/Logs/DiagnosticReports/*.ips; do
            echo "--- $f"
            python3 scripts/parse_ips.py "$f" || true
          done
          echo "=== xcresult console ==="
          xcrun xcresulttool get log --path "$RUNNER_TEMP/HKBusETA.xcresult" --type console 2>&1 | tail -300 || true
          exit 1

      - name: Archive for iOS device (unsigned)
        run: |
          for attempt in 1 2 3; do
            echo "Archive attempt $attempt"
            if xcodebuild \
              -project HKBusETA.xcodeproj \
              -scheme HKBusETA \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/HKBusETA.xcarchive" \
              CODE_SIGNING_ALLOWED=NO \
              archive; then
              exit 0
            fi
            echo "Attempt $attempt failed (possible Xcode build-system crash), retrying..."
            rm -rf "$RUNNER_TEMP/HKBusETA.xcarchive"
            sleep 10
          done
          exit 1

      - name: Package unsigned IPA
        run: |
          cd "$RUNNER_TEMP"
          rm -rf Payload HKBusETA-unsigned.ipa
          mkdir -p Payload
          cp -R HKBusETA.xcarchive/Products/Applications/HKBusETA.app Payload/
          zip -qry HKBusETA-unsigned.ipa Payload
          ls -lh HKBusETA-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v5
        with:
          name: HKBusETA-unsigned-ipa
          path: ${{ runner.temp }}/HKBusETA-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
